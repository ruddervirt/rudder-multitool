name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decode and save PFX certificate
        env:
          PFX_BASE64: ${{ secrets.INTERNAL_RUDDERVIRT_SIGNING_PFX }}
        run: |
          echo "$PFX_BASE64" | base64 -d > ruddervirt.pfx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with Docker
        run: |
          docker build -f Containerfile --build-arg SIGNING_PASSWORD="${{ secrets.INTERNAL_RUDDERVIRT_SIGNING_PASSWORD }}" -t ruddermultitool-builder .
          
      - name: Extract binaries from Docker image
        run: |
          docker create --name build ruddermultitool-builder
          docker cp build:/output/. .
          docker rm build

      - name: Clean up certificate
        if: always()
        run: |
          rm -f ruddervirt.pfx

      - name: Get version from tag
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ./rudder-multitool.exe
            ./rudder-multitool-linux
            ./rudder-multitool-mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          